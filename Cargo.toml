[package]
name = "floating-timer"
version = "0.1.0"
edition = "2024"
description = "Always-on-top floating countdown timer, written in Rust"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "links",
] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
ksni = { version = "0.3", features = ["blocking"] }
notify-rust = "4"
zbus = { version = "5", default-features = false, features = ["blocking-api"] }
x11rb = "0.14"
winit = "0.30"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
